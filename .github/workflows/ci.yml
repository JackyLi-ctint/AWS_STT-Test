name: CI Build and Test

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
      - 'feature/*'

permissions:
  contents: read

jobs:
  build-test:
    name: CI Build and Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run syntax compilation checks
        shell: pwsh
        run: python -m compileall lambdas tests

      - name: Build Lambda deployment packages
        shell: pwsh
        run: .\scripts\build_lambda_packages.ps1

      - name: Upload Lambda artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-packages
          path: |
            build/start_transcription.zip
            build/process_transcript.zip
          if-no-files-found: error
